<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tap</title>
<!--
  Generic tap-to-text page (GitHub Pages: christianschoder/tap). Holds NO data.
  Everything comes in the link's #fragment, which browsers never send to the server:
    #d=<batch title>&n=<name>&h=<hint>&p=<+1XXXXXXXXXX>&t=<text 1>&t=<text 2>&n=<next name>...
  (each value URI-encoded, the number's + as %2B; every n starts a new person; d and h optional).
  Each bubble is an sms: link that opens Google Messages with that text typed in.
  Source of truth: Z:\other\promo_assist\templates\tap-page\index.html
-->
<style>
:root { --bg: #f6f7f9; --fg: #15181d; --muted: #667080; --bubble: #dfe8fb; --bubble-fg: #0f2a5c; --done: #e6e8ec; --done-fg: #8a92a0; }
@media (prefers-color-scheme: dark) { :root { --bg: #121417; --fg: #e8eaee; --muted: #9aa3b1; --bubble: #26324a; --bubble-fg: #dce6fb; --done: #1d2026; --done-fg: #6b7380; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.45 Roboto, system-ui, sans-serif; padding: 24px 16px 48px; }
main { max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
h1 { font-size: 1.3rem; margin: 0 0 4px; }
h2 { font-size: 1.05rem; margin: 22px 0 0; }
h2.done { color: var(--done-fg); }
p { margin: 0; color: var(--muted); font-size: .9rem; }
a.b { display: block; padding: 14px 18px; border-radius: 22px; background: var(--bubble); color: var(--bubble-fg); text-decoration: none; }
a.b.done { background: var(--done); color: var(--done-fg); }
a.alt { font-size: .8rem; color: var(--muted); align-self: flex-end; }
</style>
</head>
<body>
<main id="m"><p>Nothing to show: this page needs a link with the texts in it.</p></main>
<script>
(function () {
  var h = location.hash.replace(/^#/, ''); if (!h) return;
  var title = '', people = [], cur = null;
  h.split('&').forEach(function (kv) {
    var i = kv.indexOf('='); if (i < 0) return;
    var k = kv.slice(0, i), v;
    try { v = decodeURIComponent(kv.slice(i + 1).replace(/\+/g, '%20')); } catch (e) { return; }
    if (k === 'd') title = v;
    else if (k === 'n') { cur = { name: v, hint: '', phone: '', texts: [] }; people.push(cur); }
    else {
      if (!cur) { cur = { name: '', hint: '', phone: '', texts: [] }; people.push(cur); }
      if (k === 'p') cur.phone = v; else if (k === 'h') cur.hint = v; else if (k === 't') cur.texts.push(v);
    }
  });
  people = people.filter(function (x) { return /^\+1\d{10}$/.test(x.phone) && x.texts.length; });
  if (!people.length) return;
  var m = document.getElementById('m'); m.innerHTML = '';
  var h1 = document.createElement('h1'); h1.textContent = title || (people.length === 1 ? (people[0].name || people[0].phone) : 'Texts'); m.appendChild(h1);
  var p = document.createElement('p'); p.textContent = 'Tap a text, send it in Messages, come back for the next one.'; m.appendChild(p);
  var key = 'tap:' + h;
  var done = {}; try { done = JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) {}
  people.forEach(function (x, pi) {
    var h2 = null;
    if (people.length > 1 || title) { h2 = document.createElement('h2'); h2.textContent = x.name || x.phone; m.appendChild(h2); }
    if (x.hint) { var hp = document.createElement('p'); hp.textContent = x.hint; m.appendChild(hp); }
    var mark = function () { if (h2) h2.className = x.texts.every(function (_, ti) { return done[pi + '.' + ti]; }) ? 'done' : ''; };
    x.texts.forEach(function (t, ti) {
      var id = pi + '.' + ti;
      var a = document.createElement('a'); a.className = 'b' + (done[id] ? ' done' : '');
      a.href = 'sms:' + x.phone + '?body=' + encodeURIComponent(t); a.textContent = t;
      a.addEventListener('click', function () { a.className = 'b done'; done[id] = 1; mark(); try { localStorage.setItem(key, JSON.stringify(done)); } catch (e) {} });
      m.appendChild(a);
      var alt = document.createElement('a'); alt.className = 'alt';
      alt.href = 'intent://send/' + x.phone + '#Intent;scheme=smsto;package=com.google.android.apps.messaging;S.sms_body=' + encodeURIComponent(t) + ';end';
      alt.textContent = 'other way'; m.appendChild(alt);
    });
    mark();
  });
})();
</script>
</body>
</html>
